name: Verificar codigo al dia con producción

on:
    pull_request:
        branches:
            - main

jobs:
    check-ancestor:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout con historial completo
              uses: actions/checkout@v4
              with:
                fetch-depth: 0

            - name: Verificar que la rama contiene el último main
              run: |
                git fetch origin main
                HEAD_REAL="${{ github.event.pull_request.head.sha }}"
                echo "INFO: Comparando SHA real de la rama: $HEAD_REAL"
                if git merge-base --is-ancestor origin/main $HEAD_REAL; then
                    echo "OK: La rama contiene el último codigo productivo"
                else
                    echo "ERROR: La rama esta desactualizada respecto a main"
                    echo "Integra main antes de fusionar"
                    exit 1
                fi